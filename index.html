<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Preflight Check</title>
  <meta name="gemini-api-key" content="YOUR_KEY_HERE">

  <!-- CSP (Content Security Policy) -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://aistudiocdn.com;
    style-src  'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com;
    font-src   'self' https://fonts.gstatic.com;
    connect-src 'self' https://aistudiocdn.com https://generativelanguage.googleapis.com https://*.googleapis.com https://*.googleusercontent.com;
    img-src 'self' data: https:;
    worker-src 'self' blob:;
    frame-ancestors 'self';
    base-uri 'self'; form-action 'self'; upgrade-insecure-requests;
  ">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom CSS for transitions -->
  <link rel="stylesheet" href="index.css">

  <!-- Import Map for third-party libraries -->
  <script type="importmap" id="main-importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@18.3.1/esm/react.js",
    "react-dom/client": "https://aistudiocdn.com/react-dom@18.3.1/esm/react-dom_client.js",
    "@google/genai": "https://aistudiocdn.com/@google/genai@0.11.0/dist/index.mjs",
    "pdfjs-dist/build/pdf": "https://aistudiocdn.com/pdfjs-dist@4.4.168/build/pdf.mjs",
    "pdfjs-dist/build/pdf.worker.min.mjs": "https://aistudiocdn.com/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs",
    "@heroicons/react/24/outline": "https://aistudiocdn.com/@heroicons/react@2.2.0/24/outline/index.mjs",
    "marked": "https://aistudiocdn.com/marked@12.0.2/lib/marked.esm.js",
    "dompurify": "https://aistudiocdn.com/dompurify@3.0.11/dist/purify.es.js"
  }
}
</script>

  <!-- SystemJS and Babel Standalone -->
  <script src="https://aistudiocdn.com/systemjs@6.14.3/dist/s.min.js"></script>
  <script src="https://aistudiocdn.com/@babel/standalone@7.24.0/babel.min.js"></script>

  <!-- Load SystemJS Babel Loader and then the app -->
  <script>
    // Ensure SystemJS is loaded before we try to use it
    if (typeof System === 'undefined') {
      console.error('SystemJS is not defined. Ensure s.min.js loaded correctly.');
    } else {
      // Configure SystemJS to use the correct base for local modules
      System.config({
        baseURL: './' // Current directory for local app files
      });
      System.import('./loader/systemjs-babel-loader.ts')
        .then(() => System.import('./index.tsx'))
        .catch(err => console.error('Error loading application:', err));
    }
  </script>

<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "@heroicons/react/": "https://aistudiocdn.com/@heroicons/react@^2.2.0/",
    "pdfjs-dist/": "https://aistudiocdn.com/pdfjs-dist@^5.4.296/",
    "marked": "https://aistudiocdn.com/marked@^16.4.1",
    "dompurify": "https://aistudiocdn.com/dompurify@^3.3.0",
    "webworker": "https://aistudiocdn.com/webworker@^0.8.4"
  }
}
</script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">
  <div id="root"></div>
</body>
</html>
